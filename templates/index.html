<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Prediction System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Placement Prediction System</h1>

        <form action="/" method="POST">

            <label for="cgpa">CGPA</label>

            <input
                type="number"
                id="cgpa"
                name="cgpa"
                step="0.01"
                min="0"
                max="10"
                placeholder="Enter CGPA"
                required>

            <label for="marks">Placement Exam Marks</label>

            <input
                type="number"
                id="marks"
                name="marks"
                min="0"
                max="100"
                placeholder="Enter Marks"
                required>

            <label for="internship">Internship Experience</label>

            <select id="internship" name="internship" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label for="tier">College Tier</label>

            <select id="tier" name="tier" required>
                <option value="Tier 1">Tier 1</option>
                <option value="Tier 2">Tier 2</option>
                <option value="Tier 3">Tier 3</option>
            </select>

            <button type="submit">
                Predict Placement
            </button>

        </form>

        {% if prediction %}

<div class="result">

    <h2>Prediction Result</h2>

    <div class="{{ prediction_class }}">

        {% if prediction == "Placed" %}
            ✅ {{ prediction }}
        {% else %}
            ❌ {{ prediction }}
        {% endif %}

    </div>

</div>

{% endif %}

    </div>

</body>

</html>
